[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Log level
log_cli = true
log_cli_level = INFO

# Timeout
timeout = 120

# Markers
markers =
    login: tests liên quan đến đăng nhập (REQ-01)
    search: tests liên quan đến tìm kiếm (REQ-03)
    borrow: tests liên quan đến mượn sách (REQ-04)
    return: tests liên quan đến trả sách (REQ-05)
    general: tests chức năng chung (đăng xuất, ngôn ngữ)
    member: tests quản lý thành viên (REQ-07)
    smoke: nhóm smoke test cơ bản

# Output
addopts = -v --tb=short